name: Probe full Delft3D FM runtime accessibility

on:
  workflow_dispatch:
  push:
    paths: [.github/workflows/solver-probe.yml]

permissions:
  contents: read

jobs:
  registry-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check image registry without credentials or downloading large layers
        shell: bash
        run: |
          set +e
          for endpoint in \
            https://containers.deltares.nl/v2/ \
            https://containers.deltares.nl/v2/delft3d/delft3dfm/manifests/2026.02-release \
            https://containers.deltares.nl/v2/delft3d-dev/delft3d-third-party-libs/manifests/oneapi-2024-ifx-release; do
            echo "Probing $endpoint"
            curl --connect-timeout 8 --max-time 20 -L -sS -o /dev/null -w 'http=%{http_code} error=%{errormsg}\n' -H 'Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.v2+json' "$endpoint"
          done
          echo 'Attempting anonymous Docker manifest resolution (no layer download)'
          for image in \
            containers.deltares.nl/delft3d/delft3dfm:2026.02-release \
            containers.deltares.nl/delft3d-dev/delft3d-third-party-libs:oneapi-2024-ifx-release; do
            echo "Image $image"
            timeout 35 docker manifest inspect "$image" >/dev/null
            echo "docker_manifest_exit_code=$?"
          done
          echo 'This only checks reachability and authorization. No full solver was run.'
