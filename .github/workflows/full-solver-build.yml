name: Attempt pinned native D-Flow FM build (public toolchain)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pinned-solver-build
  cancel-in-progress: false

jobs:
  build-native-solver:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Checkout independent research repository
        uses: actions/checkout@v4

      - name: Prepare ephemeral runner disk
        shell: bash
        run: |
          df -h .
          # Avoid recursive removal of large hosted-runner SDK trees here:
          # it can monopolize the job before source checkout even starts.
          docker system df || true
          df -h .

      - name: Fetch complete pinned source as an independent copy
        shell: bash
        run: |
          set -euxo pipefail
          git init native-src
          git -C native-src remote add origin https://github.com/Deltares/Delft3D.git
          git -C native-src fetch --depth=1 --filter=blob:none origin fc48ceb1692afd87699f4cda081884c4bf4d2a91
          git -C native-src checkout --detach FETCH_HEAD
          test "$(git -C native-src rev-parse HEAD)" = fc48ceb1692afd87699f4cda081884c4bf4d2a91
          df -h .

      - name: Build public Intel oneAPI compiler image
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain --file ci/public-intel-base.Dockerfile --tag local/delft3d-public-buildtools:2024 .
          docker run --rm local/delft3d-public-buildtools:2024 bash -lc 'source /etc/bashrc; ifx --version; cmake --version; conan --version'
          df -h .

      - name: Build remaining original Delft3D third-party libraries
        shell: bash
        run: |
          set -euo pipefail
          docker build --progress=plain \
            --file native-src/ci/dockerfiles/linux/third-party-libs.Dockerfile \
            --build-arg BUILDTOOLS_IMAGE_URL=local/delft3d-public-buildtools \
            --build-arg BUILDTOOLS_IMAGE_TAG=2024 \
            --build-arg INTEL_ONEAPI_VERSION=2024 \
            --build-arg INTEL_FORTRAN_COMPILER=ifx \
            --tag local/delft3d-public-thirdparty:2024 .
          df -h .

      - name: Configure, compile and install pinned D-Flow FM executable
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --shm-size=2g \
            -v "$PWD/native-src:/delft3d" -w /delft3d \
            local/delft3d-public-thirdparty:2024 \
            bash -lc 'source /etc/bashrc; python3 run_conan.py initialize external; python3 build.py --config dflowfm --profile delft3d_alma8_intel_2024_v3 --build --build-type Release --build-dependencies --ci'
          df -h .

      - name: Identify runnable native binaries and available example models
        shell: bash
        run: |
          set -euo pipefail
          test -d native-src/build_dflowfm_release/install
          du -sh native-src/build_dflowfm_release/install
          find native-src/build_dflowfm_release/install -type f -name '*dflowfm*' -print
          find native-src/examples/dflowfm -maxdepth 4 -type f -name '*.mdu' -print | sort | head -40
          echo "Pinned full D-Flow FM compiled; proceeding to real WAQ model cases."

      - name: Execute original example with WAQ and nonlinear retry variants
        shell: bash
        run: |
          set -euo pipefail
          DELFT3D_SOURCE_ROOT="$PWD/native-src" python3 scripts/prepare_native_waq_models.py
          baseline_ok=0
          reproduced=0
          for case in baseline one-iteration-limit two-iteration-limit three-iteration-limit; do
            echo "Running candidate: $case"
            set +e
            docker run --rm --shm-size=2g \
              -v "$PWD/native-src:/delft3d" -v "$PWD/build/native-waq-models:/models" \
              -w "/models/$case" local/delft3d-public-thirdparty:2024 \
              bash -lc '/delft3d/build_dflowfm_release/install/bin/run_dflowfm.sh FlowFM.mdu' \
              >"build/native-waq-models/$case/native-run.log" 2>&1
            rc=$?
            set -e
            echo "$case solver_exit_code=$rc"
            printf 'exit_code=%s\n' "$rc" >"build/native-waq-models/$case/exit-code.txt"
            if [ "$rc" -eq 0 ] && find "build/native-waq-models/$case" -name '*.flo' -type f | grep -q .; then
              echo "$case: real .flo output produced"
              [ "$case" = baseline ] && baseline_ok=1
              if [ "$case" != baseline ] && grep -qi 'No convergence in nonlinear solver' "build/native-waq-models/$case/native-run.log"; then
                reproduced=1
                echo "$case: retry warning and real .flo output both found"
              fi
            fi
          done
          test "$baseline_ok" -eq 1 || { echo 'Native baseline did not produce a .flo output'; exit 1; }
          test "$reproduced" -eq 1 || { echo 'No valid native convergence retry with .flo output was observed'; exit 1; }
          echo 'Native retry and .flo existence confirmed; quantitative flux comparison remains necessary.'

      - name: Upload native model evidence even if simulation fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-waq-model-evidence
          path: |
            build/native-waq-models/**/*.log
            build/native-waq-models/**/*.flo
            build/native-waq-models/**/*.mdu
            build/native-waq-models/**/exit-code.txt
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload native build outputs if successful
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pinned-dflowfm-native-build
          path: native-src/build_dflowfm_release/install/
          retention-days: 1
